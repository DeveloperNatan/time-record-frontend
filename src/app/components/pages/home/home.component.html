<main class="flex min-h-screen bg-white">
    <!-- Navbar lateral: 30% no desktop -->
    <section
        class="flex min-h-screen w-full flex-col border-r border-slate-200 bg-white px-6 py-10 lg:w-[30%] lg:min-w-[380px] lg:px-10"
    >
        <!-- Marca -->
        <div class="mb-16 flex items-center gap-3">
            <div class="flex h-11 w-11 items-center justify-center overflow-hidden rounded-lg">
                <img
                    src="assets/clock.jpeg"
                    alt="Logo Time Record"
                    class="h-full w-full object-cover"
                />
            </div>

            <div>
                <strong class="block text-base tracking-tight text-slate-900">
                    Time Record
                </strong>

                <span class="mt-0.5 block text-xs text-slate-500">
                    Gestão de pessoas
                </span>
            </div>
        </div>

        <!-- Navegacao -->
        <nav class="mb-auto space-y-2">
            <a
                routerLink="/folha"
                class="flex items-center gap-3 rounded-lg px-4 py-4 text-sm font-semibold text-slate-700 hover:bg-slate-50 hover:text-emerald-700"
            >
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                Folha
            </a>

            <a
                routerLink="/ferias"
                class="flex items-center gap-3 rounded-lg px-4 py-4 text-sm font-semibold text-slate-700 hover:bg-slate-50 hover:text-emerald-700"
            >
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7" />
                </svg>
                Ferias
            </a>

            <a
                routerLink="/meus-pontos"
                class="flex items-center gap-3 rounded-lg px-4 py-4 text-sm font-semibold text-slate-700 hover:bg-slate-50 hover:text-emerald-700"
            >
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                Meus Pontos
            </a>

            <a
                routerLink="/configuracoes"
                class="flex items-center gap-3 rounded-lg px-4 py-4 text-sm font-semibold text-slate-700 hover:bg-slate-50 hover:text-emerald-700"
            >
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                Configurações
            </a>

            <a
                routerLink="/perfil"
                class="flex items-center gap-3 rounded-lg px-4 py-4 text-sm font-semibold text-slate-700 hover:bg-slate-50 hover:text-emerald-700"
            >
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
                Perfil
            </a>
        </nav>

        <!-- Informacoes do usuario -->
        <div class="mt-auto pt-6">
            <div class="flex items-center gap-3 rounded-lg bg-slate-50 px-4 py-3">
                <div class="flex h-10 w-10 items-center justify-center rounded-full bg-emerald-700 text-white font-bold">
                    {{ usuario.nome.charAt(0).toUpperCase() }}
                </div>
                <div>
                    <p class="text-sm font-semibold text-slate-900">{{ usuario.nome }}</p>
                    <p class="text-xs text-slate-500">{{ usuario.cargo }}</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Painel principal: 70% no desktop -->
    <section class="flex min-h-screen w-full items-center justify-center bg-gradient-to-br from-slate-50 to-white lg:w-[70%]">
        <div class="text-center">
            <!-- Saudacao -->
            <div class="mb-12">
                <h1 class="mb-3 text-4xl font-bold tracking-tight text-slate-900 lg:text-5xl">
                    Olá, {{ usuario.nome }}!
                </h1>
                <p class="text-lg text-slate-500">
                    Registre seu ponto de forma rápida e simples.
                </p>
            </div>

            <!-- Botao circular de marcar ponto -->
            <div class="mb-8 flex items-center justify-center">
                <button
                    (click)="marcarPonto()"
                    class="group relative flex h-56 w-56 items-center justify-center rounded-full bg-emerald-700 shadow-2xl transition-all duration-300 hover:scale-105 hover:bg-emerald-800 hover:shadow-emerald-700/30 focus:outline-none focus:ring-4 focus:ring-emerald-700/30 lg:h-64 lg:w-64"
                >
                    <!-- Anel externo decorativo -->
                    <div class="absolute inset-0 rounded-full border-4 border-emerald-200 opacity-30"></div>

                    <!-- Icone -->
                    <div class="flex flex-col items-center justify-center text-white">
                        <svg class="mb-3 h-16 w-16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <span class="text-lg font-bold tracking-wide">MARCAR<br />PONTO</span>
                    </div>

                    <!-- Efeito de hover -->
                    <div class="absolute inset-0 rounded-full bg-white opacity-0 transition-opacity duration-300 group-hover:opacity-10"></div>
                </button>
            </div>

            <!-- Horario atual -->
            <div class="rounded-full bg-slate-100 px-6 py-3 inline-block">
                <p class="text-sm font-medium text-slate-600">
                    {{ horarioAtual }}
                </p>
            </div>

            <!-- Ultima marcacao -->
            <div class="mt-8 text-center">
                <p class="text-sm text-slate-500">
                    Última marcação:
                    <span class="font-semibold text-slate-700">{{ ultimaMarcacao }}</span>
                </p>
            </div>
        </div>
    </section>
</main>
